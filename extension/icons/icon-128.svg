<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="50%" stop-color="#4c3dc9"/>
      <stop offset="100%" stop-color="#6554c0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="38" y1="64" x2="90" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b3d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle inner shadow -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Left curly brace { -->
  <path d="M32 40c0-4 2.8-6.8 6.8-6.8H44v6h-3.6c-1.4 0-2.2.8-2.2 2.2v14c0 2.8-2 4.8-4.6 5.4 2.6.6 4.6 2.6 4.6 5.4v14c0 1.4.8 2.2 2.2 2.2H44v6h-5.2c-4 0-6.8-2.8-6.8-6.8V68.4c0-2.2-1.4-3.2-3.2-3.2v-9.6c1.8 0 3.2-1 3.2-3.2z" fill="white" opacity="0.92" filter="url(#glow)"/>

  <!-- Right curly brace } -->
  <path d="M96 88c0 4-2.8 6.8-6.8 6.8H84v-6h3.6c1.4 0 2.2-.8 2.2-2.2v-14c0-2.8 2-4.8 4.6-5.4-2.6-.6-4.6-2.6-4.6-5.4v-14c0-1.4-.8-2.2-2.2-2.2H84v-6h5.2c4 0 6.8 2.8 6.8 6.8v13.2c0 2.2 1.4 3.2 3.2 3.2v9.6c-1.8 0-3.2 1-3.2 3.2z" fill="white" opacity="0.92" filter="url(#glow)"/>

  <!-- Up arrow (export: wiki → markdown) -->
  <path d="M50 53l10-11 10 11" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Down arrow (import: markdown → wiki) -->
  <path d="M56 75l10 11 10-11" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Center hash # (markdown symbol) -->
  <g opacity="0.8">
    <rect x="58" y="50" width="4" height="28" rx="2" fill="white" transform="rotate(-12 60 64)"/>
    <rect x="67" y="50" width="4" height="28" rx="2" fill="white" transform="rotate(-12 69 64)"/>
    <rect x="54" y="58" width="22" height="3.2" rx="1.6" fill="white" opacity="0.65"/>
    <rect x="55.5" y="67" width="22" height="3.2" rx="1.6" fill="white" opacity="0.65"/>
  </g>
</svg>
